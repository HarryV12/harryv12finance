# Weekday market update: prices, Market movers, market drops and industry moves with headlines,
# extra prices, Aftermath. Runs _pipeline/pipeline/daily.py and commits what changed; GitHub Pages
# then republishes the site. Congress, Senate and officials' filings are refreshed on the PC, weekly.
name: Daily market update

on:
  workflow_dispatch: {}
  # 9:15 pm UK time, Monday to Friday, 15 minutes after the 4 pm New York close. GitHub schedules are in
  # UTC only, so there are two: 20:15 UTC is 9:15 pm in UK summer time, 21:15 UTC is 9:15 pm in winter.
  # The "when" step below lets through only the one that falls at 9 pm or later in London (the other
  # stops at once). GitHub may start a scheduled run a few minutes late.
  schedule:
    - cron: "15 20 * * 1-5"
    - cron: "15 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: site-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Is it 9 pm or later in London?
        id: when
        run: |
          hour=$(TZ=Europe/London date +%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$hour" -ge 21 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "It's ${hour}:xx in London: the other scheduled start (9:15 pm UK) will run instead."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.when.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.when.outputs.run == 'true'
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: _pipeline/requirements.txt

      - name: Install packages
        if: steps.when.outputs.run == 'true'
        run: pip install -r _pipeline/requirements.txt

      - name: Update market data
        if: steps.when.outputs.run == 'true'
        run: python -I -X utf8 _pipeline/pipeline/daily.py

      - name: Commit and push what changed
        if: steps.when.outputs.run == 'true'
        run: |
          git config user.name "HarryV12"
          git config user.email "304028176+HarryV12@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "Daily market update $(date -u +%Y-%m-%d)" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          git pull -q --rebase origin main
          git push -q origin HEAD:main

      - name: Show the to-do report
        if: always() && steps.when.outputs.run == 'true'
        run: cat _pipeline/logs/freshness.txt 2>/dev/null || true
