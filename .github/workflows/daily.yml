# Builds and publishes the site. Runs every weekday at 9:15 pm UK time (after the US close), and whenever
# something is pushed to main (the Claude writer's explanations, the weekly research, the PC's weekly
# Congress build, code changes), so what's live is always the latest data.
#
# The big price files (prices.js, series.js) aren't kept in git: each run downloads fresh closes, rebuilds
# them, re-prices open trades in data.js, and publishes the whole site straight to Cloudflare Pages
# (https://harryv12finance.pages.dev). The old GitHub Pages address only sends visitors there. Only the
# small files that change (market moves, Aftermath, extra prices, new news searches) are committed, so the
# repository stays small. Congress, Senate and officials' filings come from the PC's weekly build (data.js).
name: Daily market update

on:
  workflow_dispatch:
    inputs:
      refresh_figures:
        description: "Fetch every company's EPS, revenue, profit and debt now (normally Fridays only)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ["_pipeline/**/*.md", "README.md"]
  # 9:15 pm UK time, Monday to Friday, 15 minutes after the 4 pm New York close. GitHub schedules are in
  # UTC only, so there are two: 20:15 UTC is 9:15 pm in UK summer time, 21:15 UTC is 9:15 pm in winter.
  # Both run: the one before the close (in winter) just finds no new close. GitHub often starts scheduled runs
  # late (hours, at busy times), so nothing here depends on the exact time; the Claude writer waits for the data.
  schedule:
    - cron: "15 20 * * 1-5"
    - cron: "15 21 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site-update
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # the branch as it is now (a queued run would otherwise start from the commit that queued it)
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: _pipeline/requirements.txt

      - name: Install packages
        run: pip install -r _pipeline/requirements.txt

      - name: Update market data
        env:
          CTC_FUND_FORCE: ${{ inputs.refresh_figures && '1' || '' }}
        run: python -I -X utf8 _pipeline/pipeline/daily.py

      - name: Commit the small files that changed
        run: |
          git config user.name "HarryV12"
          git config user.email "304028176+HarryV12@users.noreply.github.com"
          # data.js is re-priced for publishing only; the PC's weekly build is the one kept in git
          git add market_moves.js aftermath.js extra_prices.js fundamentals.js _pipeline/cache/news
          if git diff --cached --quiet; then echo "no changes to keep"; exit 0; fi
          git commit -q -m "Daily market update $(date -u +%Y-%m-%d)" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          git stash -q --include-untracked
          # these files are rebuilt on every run, so if another run saved them meanwhile, this newer copy wins
          git pull -q --rebase -X theirs origin main
          git push -q origin HEAD:main
          git stash pop -q

      - name: Gather the files the site serves
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_pipeline' --exclude '_site' --exclude 'versions' \
            --exclude 'README.md' --exclude '.gitignore' --exclude 'data.json' ./ _site/
          touch _site/.nojekyll
          du -sh _site
          # the old harryv12.github.io/harryv12finance address: every page there sends visitors to the same page
          # on Cloudflare (404.html catches paths like /v2/ and /classic.html)
          mkdir -p _moved
          cp .github/moved.html _moved/index.html
          cp .github/moved.html _moved/404.html
          touch _moved/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _moved

      - name: Point the old GitHub Pages address to Cloudflare
        id: deploy
        uses: actions/deploy-pages@v4

      # Cloudflare is skipped (not failed) if the CLOUDFLARE_API_TOKEN secret is missing, so the rest of the run
      # still works. The account ID is the CLOUDFLARE_ACCOUNT_ID repository variable.
      - name: Check for the Cloudflare token
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "ready=yes" >> "$GITHUB_OUTPUT"
          else echo "no CLOUDFLARE_API_TOKEN secret yet, so Cloudflare Pages is skipped"; fi

      - name: Publish to Cloudflare Pages
        if: steps.cloudflare.outputs.ready == 'yes'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=harryv12finance --branch=main --commit-dirty=true

      - name: Show the to-do report
        if: always()
        run: cat _pipeline/logs/freshness.txt 2>/dev/null || true
