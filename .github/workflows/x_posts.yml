# Makes the day's Data Visualization images and posts them to X (_pipeline/x_posts/x_posts.py). The Cloudflare timer
# (harryv12finance-timer) starts this at 9:45 pm UK, Monday to Friday, half an hour after the daily update. It has no
# GitHub schedule of its own, because GitHub's often starts hours late and a late post is worse than none.
#
# The X_POST_MODE repository variable decides what happens: test, or not set, posts nothing and only updates the gallery
# at https://x-preview.harryv12finance.pages.dev; live posts to X, using the X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN and
# X_ACCESS_SECRET secrets. Setting it back to test stops the posting at once.
name: Post images to X

on:
  workflow_dispatch:
    inputs:
      preview_all:
        description: "Make one of each image for the gallery (never posts, even in live mode)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: x-posts
  cancel-in-progress: false

jobs:
  make-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # the branch as it is now, so a queued run sees what the run before it posted
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: _pipeline/x_posts/requirements.txt

      - name: Install packages and the invisible browser
        run: |
          pip install -r _pipeline/x_posts/requirements.txt
          playwright install --with-deps chromium

      - name: Make the images (and post them, in live mode)
        env:
          X_POST_MODE: ${{ vars.X_POST_MODE }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python -I -X utf8 _pipeline/x_posts/x_posts.py ${{ inputs.preview_all && '--preview-all' || '' }}

      # always: a post that went out has to be remembered even if the next one failed, or it would go out twice
      - name: Remember what went out
        if: always()
        run: |
          git config user.name "HarryV12"
          git config user.email "304028176+HarryV12@users.noreply.github.com"
          git add _pipeline/x_posts/state.json 2>/dev/null || exit 0
          if git diff --cached --quiet; then echo "nothing new to remember"; exit 0; fi
          git commit -q -m "X posts $(date -u +%Y-%m-%d)" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          for try in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1

      - name: Update the gallery
        if: always() && hashFiles('_x_preview/index.html') != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _x_preview --project-name=harryv12finance --branch=x-preview --commit-dirty=true
